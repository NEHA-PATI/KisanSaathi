services:
  - type: web
    name: bhoomiapi
    runtime: python312
    plan: free
    buildCommand: pip install -r backend/requirements.deploy.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        scope: run
        value: production
      - key: DATABASE_URL
        scope: run
        sync: false
      - key: DB_HOST
        scope: run
        sync: false
      - key: DB_PORT
        scope: run
        sync: false
      - key: DB_NAME
        scope: run
        sync: false
      - key: DB_USER
        scope: run
        sync: false
      - key: DB_PASSWORD
        scope: run
        sync: false
      - key: FRONTEND_URLS
        scope: run
        sync: false
    region: oregon
    maxInstances: 1
    healthCheckPath: /

  - type: static
    name: bhoomiapp
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - path: /*
        destination: /index.html
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        scope: build
        sync: false
